name: "PR Review Agent"
description: "Review pull requests with Claude and post structured findings as inline review comments."
author: "Afnan Waseem"
branding:
  icon: "eye"
  color: "purple"

inputs:
  anthropic_api_key:
    description: "Anthropic API key. Store it as a repository secret."
    required: true
  github_token:
    description: "Token used to read the PR and post the review. Needs pull-requests: write."
    required: false
    default: ${{ github.token }}
  model:
    description: "Claude model id. Empty uses the agent's built-in default."
    required: false
    default: ""
  min_severity:
    description: "Lowest severity to report: critical, high, medium or low."
    required: false
    default: "medium"
  max_files:
    description: "Review at most this many files, largest changes first. The summary notes how many were skipped."
    required: false
    default: "50"
  include_full_files:
    description: "Send full file contents as context, not only the diff."
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install pr-review-agent
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --disable-pip-version-check --quiet "$ACTION_PATH"

    - name: Review pull request
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        PR_REVIEW_MODEL: ${{ inputs.model }}
        INPUT_MIN_SEVERITY: ${{ inputs.min_severity }}
        INPUT_MAX_FILES: ${{ inputs.max_files }}
        INPUT_INCLUDE_FULL_FILES: ${{ inputs.include_full_files }}
      run: python -m pr_review_agent.main
