[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pr-review-agent"
version = "0.1.0"
description = "GitHub Action that reviews pull requests with an LLM and posts inline comments"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Afnan Waseem", email = "mwaseem@uchicago.edu" }]
license = { text = "MIT" }
dependencies = [
    "anthropic>=1.14,<2",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6"]

[project.scripts]
pr-review-agent = "pr_review_agent.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_review_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
